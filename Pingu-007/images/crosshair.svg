<svg xmlns="http://www.w3.org/2000/svg"
     width="32"
     height="32"
     viewBox="0 0 32 32"
     shape-rendering="crispEdges">

  <!-- Transparent background -->
  <g fill="#000000">

    <!-- Ring (made of pixel blocks) -->
    <rect x="10" y="4" width="12" height="2"/>
    <rect x="8" y="6" width="2" height="2"/>
    <rect x="22" y="6" width="2" height="2"/>

    <rect x="6" y="8" width="2" height="2"/>
    <rect x="24" y="8" width="2" height="2"/>

    <rect x="4" y="10" width="2" height="12"/>
    <rect x="26" y="10" width="2" height="12"/>

    <rect x="6" y="22" width="2" height="2"/>
    <rect x="24" y="22" width="2" height="2"/>

    <rect x="8" y="24" width="2" height="2"/>
    <rect x="22" y="24" width="2" height="2"/>
    <rect x="10" y="26" width="12" height="2"/>

    <!-- Crosshair arms -->
    <rect x="14" y="0" width="4" height="8"/>
    <rect x="14" y="24" width="4" height="8"/>
    <rect x="0" y="14" width="8" height="4"/>
    <rect x="24" y="14" width="8" height="4"/>

  </g>
</svg>